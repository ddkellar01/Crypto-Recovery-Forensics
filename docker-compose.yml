version: '3.8'

services:
  forensics-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_forensics_app
    image: ddkellar01/crypt:latest
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ETH_RPC_URL=${ETH_RPC_URL:-https://ethereum-rpc.publicnode.com}
      - BTC_RPC_URL=${BTC_RPC_URL:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./outputs:/app/outputs
      - ./src:/app/src
    working_dir: /app
    command: python -m src.forensic_report_exporter
    networks:
      - forensics-net

networks:
  forensics-net:
    driver: bridge
